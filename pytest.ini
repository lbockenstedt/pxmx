[pytest]
# Async tests are opt-in per test via @pytest.mark.asyncio (strict is the
# plugin default; stated explicitly so an upgrade that changes the default
# cannot silently start auto-running every async def).
asyncio_mode = strict
# Each async test gets its own event loop. Pinned because leaving it unset
# emits a deprecation warning on pytest-asyncio >= 0.24 and the default is
# scheduled to change.
asyncio_default_fixture_loop_scope = function
